[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-intake"
dynamic = ["version"]
description = "AI Invoice Intake backend: FastAPI service and worker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "invoice_intake.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "tools"]
mypy_path = "tools"
