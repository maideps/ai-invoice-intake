[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-intake"
dynamic = ["version"]
description = "AI Invoice Intake backend: FastAPI service and worker"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.121",  # Depends(scope=...)
    "openai>=1.66",  # Responses API with structured outputs and file inputs
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0",
    "mypy>=1.11",
    "pytest>=8.0",
    # Pinned exactly: the committed sample PDFs are byte-compared against this version's output (D-006).
    "reportlab==4.5.1",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "types-reportlab==4.5.1.20260827",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "invoice_intake.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
markers = ["postgres: needs Docker; runs against a throwaway PostgreSQL container"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "tools", "migrations"]
mypy_path = "tools"
