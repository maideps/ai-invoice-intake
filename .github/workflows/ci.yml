# The harness framework's own CI (its adoption matrix), inherited from create-harness. It does
# not set up this project's backend, PostgreSQL or Redis, so it would fail here. Switched off
# (manual runs only) until feat-011 replaces it with this project's CI (D-011).
name: ci (harness framework, disabled)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Real toolchains so the adoption matrix's python/go/rust cells run
      # instead of degrading to SKIP.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install python check tools
        run: pip install ruff pytest

      - name: Full harness check (includes the adoption matrix)
        run: npm run check

      - name: Architecture rules
        run: npm run check-arch

      # The Makefile surface delegates to the same runner; prove it on Linux
      # where make is available (the primary dev machine lacks make).
      - name: Makefile surface
        if: matrix.node == '18'
        run: make check
