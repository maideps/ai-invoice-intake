# This project's CI (D-015), replacing the harness framework's inherited workflow (D-011).
#   check:   the full harness check (lint, typecheck, tests with PostgreSQL and Redis in
#            Docker, build, Playwright e2e on the real stack) and the architecture rules
#   compose: builds the docker compose stack and runs the smoke test against it
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: repositories/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: repositories/backend/requirements-dev.lock

      - name: Install the backend (venv with dev tools)
        run: npm run setup:backend

      - name: Install the frontend and Playwright's Chromium
        run: npm run setup:frontend

      - name: Install Chromium's system libraries
        working-directory: repositories/frontend
        run: npx playwright install-deps chromium

      - name: Full check (lint, typecheck, test, build, e2e)
        run: npm run check

      - name: Architecture rules
        run: npm run check-arch

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: repositories/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the stack and smoke-test it
        run: npm run compose:smoke
