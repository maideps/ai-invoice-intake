# Serves the built dashboard and forwards /api/ to FastAPI, as the Vite dev proxy does in
# development, so the browser sees one origin and no CORS setup is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API accepts uploads up to 10 MB; let them through and let the API answer.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS, looked up per request: the API can restart (with a new address) without
    # restarting nginx, and nginx starts even when the API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # When the API is down, answer like the dev proxy, so the app can say so plainly.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        return 502 '{"detail": "The API is not running"}';
    }

    # Vite puts a content hash in every asset name, so they never change once served.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # nginx's mime.types has no .mjs; pdf.js's worker is one, and browsers refuse to run
        # a module served as application/octet-stream.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Client-side routes (such as /invoices/<id>) load the app, which then routes itself.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
